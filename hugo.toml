baseURL = 'https://beamimc.github.io/'
title = "Beatriz Campillo"
theme = 'hugo-coder'
languageCode = 'en'
defaultContentLanguage = 'en'
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
tag = 'tags'
category = 'categories'

[params]
  author = 'Bea'
  description = 'Notes, projects, and things worth sharing.'
  keywords = 'personal,projects,research'
  # Mono "eyebrow" line above the homepage headline (joined with " · ")
  info = ['PhD student', 'UNC Chapel Hill']
  # Typewriter line typed out below the info (set to '' to hide it).
  # Can also be a list of phrases to cycle through.
  typewriter = "This website is still a work in progress 🚧\nMore to come!"
  # Put your photo at static/images/avatar.jpg (or use gravatar instead)
  # avatarURL = 'images/avatar.jpg'
  # gravatar = 'beatrizcampillo29@gmail.com'
  dateFormat = 'January 2, 2006'
  since = 2026
  # Color scheme: "auto" (follow browser), "light", or "dark"
  colorScheme = 'auto'
  hideColorSchemeToggle = false
  # Site-wide custom stylesheet (assets/css/custom.css)
  customCSS = ['css/custom.css']
  # Rubber duck favicon (static/images/duck.svg)
  faviconSVG = '/images/duck.svg'

# Homepage hero (layouts/_partials/home/author.html).
# greeting/bio accept markdown; **bold** text in the greeting gets the accent color.
[params.hero]
  greeting = "Hi, I'm **Bea**"
  bio = "I'm interested in building open-source tools that make biological data easier to explore, analyze, and understand."

# Social icons on the landing page — add/remove as you like.
# icon uses Font Awesome classes.
[[params.social]]
  name = 'Github'
  icon = 'fa-brands fa-github fa-2x'
  weight = 1
  url = 'https://github.com/beamimc/'
  target = '_blank'
  rel = 'noopener'

[[params.social]]
  name = 'LinkedIn'
  icon = 'fa-brands fa-linkedin fa-2x'
  weight = 2
  url = 'https://www.linkedin.com/in/beatriz-campillo-586bb486'
  target = '_blank'
  rel = 'noopener'

